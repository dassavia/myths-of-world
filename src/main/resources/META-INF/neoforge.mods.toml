modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="mythsofworlds.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="[9.5,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="patchouli"
    type="required"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

# Optional companion: Minecraft Comes Alive Reborn. Never required; when installed it must be 7.7.32 or newer and
# loads before us. Everything about it is in compat/mca/McaCompat and in data tags that are ignored without it.
[[dependencies.${mod_id}]]
    modId="mca"
    type="optional"
    versionRange="[7.7.32,)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
    config="${mod_id}.mixins.json"
