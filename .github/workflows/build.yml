name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Everything is built and tested twice: alone, and with Minecraft Comes Alive Reborn 7.7.32 (an optional companion)
  # in the mods folder of every run. The jar on the Releases page is the one from the run without MCA.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mca: none
            neo: ''
          # MCA 7.7.32 registers its event subscribers the way newer NeoForge 21.1 builds expect (it is built
          # against 21.1.234), so this run plays on that NeoForge; the released jar is the one built above.
          - mca: '7.7.32'
            neo: '-Pneo_version=21.1.234'
    name: build (MCA ${{ matrix.mca }})
    env:
      MYTHS_EXPECT_MCA: ${{ matrix.mca != 'none' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build ${{ matrix.neo }} --stacktrace
      - name: Install MCA Reborn ${{ matrix.mca }} (NeoForge, 1.21.1) into every run
        if: matrix.mca != 'none'
        run: |
          API='https://api.modrinth.com/v2/project/minecraft-comes-alive-reborn/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D'
          curl -sfL "$API" -o mca-versions.json
          VERSION_RE="(^|[^0-9.])$(echo '${{ matrix.mca }}' | sed 's/\./\\./g')([^0-9.]|\$)"
          URL=$(jq -r --arg re "$VERSION_RE" '[.[] | select(.version_number | test($re)) | select(.version_number | test("alpha|beta") | not)][0].files | map(select(.primary))[0].url' mca-versions.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "MCA ${{ matrix.mca }} not found among:"; jq -r '.[].version_number' mca-versions.json; exit 1
          fi
          echo "MCA jar: $URL"
          curl -sfL "$URL" -o mca.jar
          for dir in run run/smoke run/client-smoke run/join-server run/join-client; do
            mkdir -p "$dir/mods" "$dir/config" && cp mca.jar "$dir/mods/"
            # MCA's own config (config/mca.json): no Destiny screen on first join, it would cover the test's screenshots.
            echo '{"version": 2, "launchIntoDestiny": false}' > "$dir/config/mca.json"
          done
      # Each run must print its own success line: a server or client that never starts would otherwise pass.
      - name: Game tests (portals, data, structures, mobs)
        run: |
          set -o pipefail
          ./gradlew runGameTestServer ${{ matrix.neo }} --stacktrace | tee gametests.log
          grep -q 'required tests passed' gametests.log
      - name: World smoke test (generate every dimension, biome and structure)
        timeout-minutes: 20
        run: |
          mkdir -p run/smoke
          echo "eula=true" > run/smoke/eula.txt
          echo "max-tick-time=-1" > run/smoke/server.properties
          set -o pipefail
          ./gradlew runSmokeTest ${{ matrix.neo }} --stacktrace | tee smoke.log
          grep -q '\[smoke\] OK' smoke.log
      - name: Client smoke test (start the game up to the title screen)
        timeout-minutes: 15
        run: |
          mkdir -p run/client-smoke
          echo "onboardAccessibility:false" > run/client-smoke/options.txt
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientSmokeTest ${{ matrix.neo }} --stacktrace | tee client-smoke.log
          grep -q '\[client-smoke\] OK' client-smoke.log
      - name: Join test (a client joins a dedicated server, syncs, draws the gear and takes screenshots)
        timeout-minutes: 20
        run: |
          mkdir -p run/join-server run/join-client
          echo "eula=true" > run/join-server/eula.txt
          printf "online-mode=false\nenforce-secure-profile=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\nmax-tick-time=-1\n" > run/join-server/server.properties
          printf "onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nrenderDistance:4\nguiScale:2\n" > run/join-client/options.txt
          ./gradlew runJoinServer ${{ matrix.neo }} --stacktrace > run/join-server.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 120); do
            if grep -q 'Done (' run/join-server.log; then break; fi
            if ! kill -0 $SERVER 2>/dev/null; then cat run/join-server.log; exit 1; fi
            sleep 5
          done
          grep -q 'Done (' run/join-server.log || { tail -n 200 run/join-server.log; exit 1; }
          CLIENT=0
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runJoinClient ${{ matrix.neo }} --stacktrace > run/join-client.log 2>&1 || CLIENT=$?
          SERVER_EXIT=0
          wait $SERVER || SERVER_EXIT=$?
          grep -h '\[join-test' run/join-server.log run/join-client.log || true
          if [ $CLIENT -ne 0 ] || [ $SERVER_EXIT -ne 0 ] || ! grep -q '\[join-test-client\] OK' run/join-client.log; then
            tail -n 150 run/join-client.log
            tail -n 80 run/join-server.log
            exit 1
          fi
      # TEMPORARY (removed before merge): the artifact store cannot be read from the dev sandbox, so print the
      # Codex screenshots into the log.
      - name: DEBUG print codex screenshots
        if: always() && github.ref != 'refs/heads/main'
        run: |
          cd run/join-client/screenshots || exit 0
          for f in codex_*_gui2.png codex_*_gui4.png codex_hellas_path_gui1.png codex_hellas_path_gui3.png heroines*.png; do
            [ -f "$f" ] || continue
            echo "BEGIN-SHOT $f"; base64 -w0 "$f"; echo; echo "END-SHOT $f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: join-test-screenshots-mca-${{ matrix.mca }}
          path: run/join-client/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: matrix.mca == 'none'
        with:
          name: mythsofworlds-jar
          path: build/libs/*.jar

  # Every push to main publishes the jar on the Releases page, so players can download it without logging in.
  # The release is named after mod_version in gradle.properties: bump it to start a new release,
  # otherwise the jar of the current release is replaced.
  release:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: mythsofworlds-jar
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.jar --clobber
          else
            gh release create "$TAG" dist/*.jar --target "$GITHUB_SHA" \
              --title "Myths of Worlds $VERSION (Minecraft 1.21.1, NeoForge)" \
              --notes-file .github/release-notes.md
          fi
