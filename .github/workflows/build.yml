name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generated resources match the generators in tools/
        run: |
          pip install --quiet pillow==12.3.0 numpy==2.5.3
          python3 tools/gen_all.py --check
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Game tests (portals, data, structures, mobs)
        run: ./gradlew runGameTestServer --stacktrace
      - name: World smoke test (generate every dimension, biome and structure)
        timeout-minutes: 20
        run: |
          mkdir -p run/smoke
          echo "eula=true" > run/smoke/eula.txt
          echo "max-tick-time=-1" > run/smoke/server.properties
          ./gradlew runSmokeTest --stacktrace
      - name: Client smoke test (start the game up to the title screen)
        timeout-minutes: 15
        run: |
          mkdir -p run/client-smoke
          echo "onboardAccessibility:false" > run/client-smoke/options.txt
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientSmokeTest --stacktrace
      - name: Join test (a client joins a dedicated server, syncs, draws the gear and takes screenshots)
        timeout-minutes: 20
        run: |
          mkdir -p run/join-server run/join-client
          echo "eula=true" > run/join-server/eula.txt
          printf "online-mode=false\nenforce-secure-profile=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\nmax-tick-time=-1\n" > run/join-server/server.properties
          printf "onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nrenderDistance:4\nguiScale:2\n" > run/join-client/options.txt
          ./gradlew runJoinServer --stacktrace > run/join-server.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 120); do
            if grep -q 'Done (' run/join-server.log; then break; fi
            if ! kill -0 $SERVER 2>/dev/null; then cat run/join-server.log; exit 1; fi
            sleep 5
          done
          grep -q 'Done (' run/join-server.log || { tail -n 200 run/join-server.log; exit 1; }
          CLIENT=0
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runJoinClient --stacktrace > run/join-client.log 2>&1 || CLIENT=$?
          SERVER_EXIT=0
          wait $SERVER || SERVER_EXIT=$?
          grep -h '\[join-test' run/join-server.log run/join-client.log || true
          if [ $CLIENT -ne 0 ] || [ $SERVER_EXIT -ne 0 ]; then
            # The game's own errors, not Gradle's stack trace at the end of the log.
            grep -v -E "org\.gradle|ALSA|flite|OpenAL" run/join-client.log | grep -n -A40 -E "Exception|Caused by|Crash Report" | head -n 250 || true
            cat run/join-client/crash-reports/*.txt 2>/dev/null | head -n 200 || true
            grep -v "org\.gradle" run/join-server.log | tail -n 80
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: join-test-screenshots
          path: |
            run/join-client/screenshots/
            run/join-client/crash-reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mythsofworlds-jar
          path: build/libs/*.jar

  # Every push to main publishes the jar on the Releases page, so players can download it without logging in.
  # The release is named after mod_version in gradle.properties: bump it to start a new release,
  # otherwise the jar of the current release is replaced.
  release:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: mythsofworlds-jar
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.jar --clobber
          else
            gh release create "$TAG" dist/*.jar --target "$GITHUB_SHA" \
              --title "Myths of Worlds $VERSION (Minecraft 1.21.1, NeoForge)" \
              --notes-file .github/release-notes.md
          fi
