name: API probe (temporary)

on:
  push:
    branches: [claude/project-thread-va3x3y]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew createMinecraftArtifacts -q
      - name: Print API
        shell: bash {0}
        run: |
          exec > /tmp/api.txt 2>&1
          JAR=$GITHUB_WORKSPACE/build/moddev/artifacts/neoforge-21.1.172.jar
          curl -sSLo /tmp/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar
          mkdir -p /tmp/cls /tmp/out && cd /tmp/cls && unzip -q -o "$JAR"
          sed -n '/^#PROBE/,$p' $GITHUB_WORKSPACE/.github/probe.txt | grep -v '^#' | while read mode cls; do
            [ -z "$mode" ] && continue
            echo "=================== $mode $cls"
            if [ "$mode" = sig ]; then javap -p -cp "$JAR" "${cls//\//.}" 2>&1 | grep -v 'lambda\$' ;
            else java -jar /tmp/vf.jar -log=ERROR "/tmp/cls/$cls.class" /tmp/out >/dev/null 2>&1; cat "/tmp/out/$(basename $cls).java"; fi
          done
      - name: Commit the dump
        run: |
          mkdir -p .probe && cp /tmp/api.txt .probe/api.txt
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add .probe && git commit -m "API dump [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME}
